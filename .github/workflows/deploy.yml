name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag ${{ secrets.DOCKERHUB_USERNAME }}/cloud-project1:$(date +%s) --tag ${{ secrets.DOCKERHUB_USERNAME }}/cloud-project1:latest

    # Run syntax test on Python file
    - name: Run Python syntax test
      run: python3 -m py_compile data_analysis.py
    # Log in to Docker Hub using repo secrets
    - name: Log in to Docker Hub
      run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
    # Run the container
    - name: Run the container
      run: docker run ${{ secrets.DOCKERHUB_USERNAME }}/cloud-project1:latest
    # Push the image to Docker Hub
    - name: Push to Docker Hub
      run: docker push --all-tags ${{ secrets.DOCKERHUB_USERNAME }}/cloud-project1

